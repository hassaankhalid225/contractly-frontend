name: contractly
description: "Contractly — your freelance contracts, always in control."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Networking
  dio: ^5.4.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^13.2.0

  # Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Auth
  google_sign_in: ^6.2.1

  # Files / images / signatures
  image_picker: ^1.1.2
  file_picker: ^8.0.0+1
  syncfusion_flutter_pdfviewer: ^24.1.41
  signature: ^5.4.0

  # UI
  shimmer: ^3.0.0
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3
  fl_chart: ^0.67.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  pinput: ^4.0.0
  intl_phone_field: ^3.2.0
  url_launcher: ^6.2.6
  flutter_markdown: ^0.7.1

  # Notifications
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

  # Misc
  intl: ^0.19.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  collection: ^1.18.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
